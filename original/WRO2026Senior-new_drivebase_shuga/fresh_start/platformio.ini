[platformio]
default_envs = pico2

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:pico2_ff_calibration]
extends = env:pico2
build_flags = -DDRIVE_FF_CALIBRATION
build_src_filter = +<*> -<main.cpp>
